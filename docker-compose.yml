services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobee
      POSTGRES_PASSWORD: jobee
      POSTGRES_DB: jobee
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobee -d jobee"]
      interval: 2s
      timeout: 5s
      retries: 10
